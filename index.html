*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--g100);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}

.controls{max-width:800px;margin:1rem auto;padding:0 1rem;display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.btn{padding:.5rem 1rem;border:none;border-radius:var(--rad);font-size:.8rem;cursor:pointer;transition:var(--tr);font-family:inherit}
.btn-o{background:var(--white);color:var(--g700);border:1px solid var(--g300)}

.btn-d{background:var(--white);color:#c0392b;border:1px solid #e8c4c0}
.btn-d:hover{background:#fdf0ef}
.container{max-width:800px;margin:0 auto;padding:0 1rem 3rem}
.section{background:var(--white);border-radius:var(--rad);margin-bottom:.75rem;box-shadow:var(--shadow);overflow:hidden}
.sec-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;transition:background var(--tr);gap:.75rem}

.sec-info{flex:1;min-width:0}
.sec-day{font-size:.7rem;font-weight:600;color:var(--gold-dark);letter-spacing:.06em}
.sec-title{font-size:.95rem;font-weight:700;color:var(--navy);line-height:1.4}
.sec-meta{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.sec-ptxt{font-size:.75rem;color:var(--g500);white-space:nowrap}
.sec-pbar{width:48px;height:4px;background:var(--g200);border-radius:2px;overflow:hidden}
.sec-pfill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.sec-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}

.section.open .sec-body{max-height:3000px}
.sec-body-in{padding:0 1.25rem 1rem}
.step{display:flex;gap:.75rem;padding:.75rem 0;border-top:1px solid var(--g100);transition:opacity var(--tr)}
.step.chk{opacity:.55}
.step-cb{flex-shrink:0;margin-top:2px}
.step-cb input{display:none}
.step-cb label{display:block;width:22px;height:22px;border:2px solid var(--g300);border-radius:6px;cursor:pointer;position:relative;transition:var(--tr)}
.step-cb input:checked+label{background:var(--gold);border-color:var(--gold)}
.step-cb input:checked+label::after{content:'';position:absolute;left:5px;top:2px;width:7px;height:11px;border:solid var(--white);border-width:0 2px 2px 0;transform:rotate(45deg)}
.step-ct{flex:1;min-width:0}
.step-n{font-size:.7rem;font-weight:700;color:var(--gold-dark);margin-bottom:.1rem}
.step-t{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.5;transition:var(--tr)}
.step.chk .step-t{text-decoration:line-through;text-decoration-color:var(--g400);color:var(--text-m)}
.step-det{margin-top:.4rem}
.step-desc,.step-comp{font-size:.8rem;line-height:1.6;color:var(--g600)}
.step-desc{margin-bottom:.3rem}
.step-comp{color:var(--gold-dark);font-weight:500}
.step-comp::before{content:'\2713 '}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-ov.active{display:flex}
.modal{background:var(--white);border-radius:12px;padding:2rem;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.modal h3{font-size:1.1rem;margin-bottom:.5rem;color:var(--navy)}
.modal p{font-size:.85rem;color:var(--g600);margin-bottom:1.5rem}
.modal-acts{display:flex;gap:.75rem;justify-content:center}
.modal-acts .btn{padding:.6rem 1.5rem;font-size:.85rem}
.btn-cd{background:#c0392b;color:var(--white)}
.btn-cd:hover{background:#a93226}
.ctx-panel{max-width:800px;margin:1rem auto .5rem;padding:0 1rem}
.ctx-box{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);border-left:4px solid var(--gold);overflow:hidden}
.ctx-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;gap:.75rem;transition:background var(--tr)}
.ctx-hd:hover{background:var(--g50)}
.ctx-hd-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--white);flex-shrink:0}
.ctx-hd-info{flex:1}
.ctx-hd-label{font-size:.7rem;font-weight:600;color:var(--gold-dark);letter-spacing:.06em}
.ctx-hd-val{font-size:1rem;font-weight:700;color:var(--navy)}
.ctx-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.ctx-box.open .ctx-chev{transform:rotate(180deg)}
.ctx-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.ctx-box.open .ctx-body{max-height:800px}
.ctx-body-in{padding:0 1.25rem 1.25rem}
.ctx-row{display:flex;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.ctx-field{flex:1;min-width:140px}
.ctx-field label{display:block;font-size:.75rem;font-weight:600;color:var(--g600);margin-bottom:.3rem}
.ctx-field select{width:100%;padding:.5rem .75rem;border:1px solid var(--g300);border-radius:6px;font-size:.88rem;font-family:inherit;color:var(--text);background:var(--white);cursor:pointer;transition:border-color var(--tr)}
.ctx-field select:focus{outline:none;border-color:var(--gold)}
.ctx-script{margin-top:.75rem;background:var(--g50);border-radius:6px;padding:1rem;border:1px solid var(--g200)}
.ctx-script-label{font-size:.7rem;font-weight:700;color:var(--gold-dark);letter-spacing:.06em;margin-bottom:.5rem}
.ctx-script-body{font-size:.85rem;line-height:1.8;color:var(--text)}

@media(max-width:600px){

.sec-title{font-size:.88rem}.sec-body-in{padding:0 1rem .75rem}.sec-pbar{width:36px}
.ctx-row{flex-direction:column}

</style>
</head>

var st=JSON.parse(localStorage.getItem(K)||'{}');
function save(){localStorage.setItem(K,JSON.stringify(st))}
function updProg(){
var done=0;for(var k in st){if(st[k])done++}
document.getElementById('pCnt').textContent=done+' / '+TOTAL+' 完了';
document.getElementById('pPct').textContent=Math.round(done/TOTAL*100)+'%';
document.getElementById('pBar').style.width=(done/TOTAL*100)+'%';
S.forEach(function(sec){
var cnt=0;sec.steps.forEach(function(s){if(st[s.n])cnt++});
var el=document.getElementById('sp-'+sec.id);
if(el)el.textContent=cnt+'/'+sec.steps.length;
var pf=document.getElementById('spf-'+sec.id);
if(pf)pf.style.width=(cnt/sec.steps.length*100)+'%';
});
}
function render(){
var app=document.getElementById('app');
var h='';
S.forEach(function(sec){
h+='<div class="section" id="sec-'+sec.id+'">';
h+='<div class="sec-hd" onclick="togSec(\''+sec.id+'\')">';
h+='<div class="sec-icon">'+sec.icon+'</div>';
h+='<div class="sec-info"><div class="sec-day">'+sec.day+'</div><div class="sec-title">'+sec.title+'</div></div>';
h+='<div class="sec-meta"><span class="sec-ptxt" id="sp-'+sec.id+'">0/'+sec.steps.length+'</span>';
h+='<div class="sec-pbar"><div class="sec-pfill" id="spf-'+sec.id+'"></div></div></div>';
h+='<svg class="sec-chev" viewBox="0 0 20 20" fill="currentColor"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>';
h+='</div><div class="sec-body"><div class="sec-body-in">';
sec.steps.forEach(function(s){
var ck=st[s.n]?'checked':'';
var cl=st[s.n]?' chk':'';
h+='<div class="step'+cl+'" id="st-'+s.n+'">';
h+='<div class="step-cb"><input type="checkbox" id="cb-'+s.n+'" '+ck+' onchange="tog('+s.n+')"><label for="cb-'+s.n+'"></label></div>';
h+='<div class="step-ct"><div class="step-n">STEP '+s.n+'</div>';
h+='<div class="step-t">'+s.t+'</div>';
h+='<div class="step-det"><div class="step-desc">'+s.d+'</div>';
h+='<div class="step-comp">'+s.c+'</div></div>';
h+='</div></div>';
});
h+='</div></div></div>';
});
app.innerHTML=h;
updProg();
}
function tog(n){
st[n]=!st[n];save();
var el=document.getElementById('st-'+n);
if(st[n])el.classList.add('chk');else el.classList.remove('chk');
updProg();
}
function togSec(id){
document.getElementById('sec-'+id).classList.toggle('open');
}
function openAll(){S.forEach(function(s){document.getElementById('sec-'+s.id).classList.add('open')})}
function closeAll(){S.forEach(function(s){document.getElementById('sec-'+s.id).classList.remove('open')})}
document.getElementById('bExpand').onclick=openAll;
document.getElementById('bCollapse').onclick=closeAll;
document.getElementById('bReset').onclick=function(){document.getElementById('mOv').classList.add('active')};
document.getElementById('bCancel').onclick=function(){document.getElementById('mOv').classList.remove('active')};
document.getElementById('bConfirm').onclick=function(){st={};save();document.getElementById('mOv').classList.remove('active');render()};
var WEEK_DATA={
'1':{role:'興味喚起',purpose:'店の存在を印象づけ、安心感の第一印象を作る',focus:'落ち着いた空間・品のある雰囲気・静けさ・余白・大人が使える店'},
'2':{role:'比較検討①',purpose:'料理の信頼感を高める',focus:'月替わりコース・季節の一皿・職人技・素材の良さ・盛り付けの美しさ'},
'3':{role:'比較検討②',purpose:'実際の利用シーンを想起させる',focus:'接待・会食・顔合わせ・個室・席間・導線・静かな会話のしやすさ'},
'4':{role:'意思決定',purpose:'今行く理由を作る',focus:'今月だけのコース・旬のピーク・今しか味わえない食材・限定性・季節感'},
'5':{role:'信頼強化',purpose:'最終的な不安を払拭する',focus:'内観・滞在イメージ・接客の気配・利用シーンへの適合・品格'}
};
var CK='instagram-manual-ctx';
var ctx=JSON.parse(localStorage.getItem(CK)||'{}');
var selShop=document.getElementById('selShop');
var selWeek=document.getElementById('selWeek');
if(ctx.shop)selShop.value=ctx.shop;
if(ctx.week)selWeek.value=ctx.week;
function updCtx(){
var shop=selShop.value;var week=selWeek.value;
ctx={shop:shop,week:week};localStorage.setItem(CK,JSON.stringify(ctx));
var sum=document.getElementById('ctxSummary');
var sc=document.getElementById('ctxScript');
var sb=document.getElementById('ctxScriptBody');
if(shop&&week){
var w=WEEK_DATA[week];
sum.textContent=shop+' \uFF5C \u7B2C'+week+'\u9031 '+w.role;
sc.style.display='block';
sb.innerHTML='<div class="role-line"><span class="tag">\u5E97\u8217</span>'+shop+'</div>'
+'<div class="role-line"><span class="tag">\u9031</span>\u7B2C'+week+'\u9031\uFF1A'+w.role+'</div>'
+'<div class="role-line"><span class="tag">\u76EE\u7684</span>'+w.purpose+'</div>'
+'<div class="role-line"><span class="tag">\u8A34\u6C42\u8EF8</span>'+w.focus+'</div>'
+'<div class="role-line"><span class="tag">\u30BF\u30FC\u30B2\u30C3\u30C8</span>30\u301C50\u4EE3\u7D4C\u55B6\u8005\u306E\u63A5\u5F85\u300140\u4EE3\u4EE5\u4E0A\u306E\u4F1A\u98DF</div>'
+'<div class="role-line"><span class="tag">\u6700\u91CD\u8981\u4FA1\u5024</span>\u5931\u6557\u3057\u306A\u3044\u5B89\u5FC3\u611F</div>';
}else if(shop){
sum.textContent=shop+' \uFF5C \u9031\u3092\u9078\u629E\u3057\u3066\u304F\u3060\u3055\u3044';
sc.style.display='none';
}else if(week){
var w=WEEK_DATA[week];
sum.textContent='\u7B2C'+week+'\u9031 '+w.role+' \uFF5C \u5E97\u8217\u3092\u9078\u629E\u3057\u3066\u304F\u3060\u3055\u3044';
sc.style.display='none';
}else{
sum.textContent='\u5E97\u8217\u3068\u9031\u3092\u9078\u629E\u3057\u3066\u304F\u3060\u3055\u3044';
sc.style.display='none';
}
}
selShop.onchange=updCtx;
selWeek.onchange=updCtx;
updCtx();
render();
var opened=false;
S.forEach(function(sec){if(!opened&&sec.steps.some(function(s){return !st[s.n]})){togSec(sec.id);opened=true}});
</script>
