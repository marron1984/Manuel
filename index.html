<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram運用マニュアル</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f5f5f0;color:#2c2c2c;line-height:1.7}
header{background:#1a1a2e;color:#fff;padding:24px 20px 8px;text-align:center}
header h1{font-size:1.3em;letter-spacing:.08em;font-weight:600}
header p.sub{font-size:.8em;color:#c4a265;margin-top:4px;letter-spacing:.15em}
.progress-area{background:#1a1a2e;padding:8px 20px 16px;position:sticky;top:0;z-index:99;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.progress-bar-wrap{background:#2a2a4a;border-radius:6px;height:10px;overflow:hidden;max-width:700px;margin:0 auto}
.progress-bar-fill{background:linear-gradient(90deg,#c4a265,#dbb978);height:100%;border-radius:6px;transition:width .4s ease}
.progress-text{text-align:center;color:#c4a265;font-size:.85em;margin-top:6px;font-weight:500}
.container{max-width:760px;margin:0 auto;padding:16px 12px 60px}
.section{background:#fff;border-radius:10px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;user-select:none;transition:background .2s}
.section-header:hover{background:#fafaf6}
.section-header .left{display:flex;align-items:center;gap:12px}
.section-header .icon{font-size:1.4em;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;border-radius:8px;flex-shrink:0}
.section-header .title-area h2{font-size:1em;font-weight:600;color:#1a1a2e}
.section-header .title-area .sec-progress{font-size:.75em;color:#999;margin-top:2px}
.section-header .arrow{font-size:.8em;color:#999;transition:transform .3s}
.section-header .arrow.open{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.section-body.open{max-height:5000px}
.step{display:flex;gap:14px;padding:14px 18px;border-top:1px solid #f0efe8;transition:opacity .3s,background .2s}
.step:hover{background:#fdfdf8}
.step.done{opacity:.55}
.step.done .step-title{text-decoration:line-through;color:#999}
.step .check-wrap{padding-top:2px;flex-shrink:0}
.step input[type=checkbox]{width:20px;height:20px;accent-color:#c4a265;cursor:pointer}
.step .step-content{flex:1;min-width:0}
.step .step-num{font-size:.7em;color:#c4a265;font-weight:700;letter-spacing:.05em}
.step .step-title{font-size:.95em;font-weight:600;color:#1a1a2e;margin:2px 0 4px}
.step .step-desc{font-size:.8em;color:#777;line-height:1.6}
.step .step-complete{font-size:.75em;color:#4a8c6f;margin-top:4px;display:flex;align-items:center;gap:4px}
.step .step-complete::before{content:"";display:inline-block;width:6px;height:6px;background:#4a8c6f;border-radius:50%}
.step .toggle-detail{font-size:.75em;color:#c4a265;cursor:pointer;margin-top:4px;display:inline-block}
.step .detail-body{display:none}
.step .detail-body.show{display:block}
.reset-area{text-align:center;padding:30px 0}
.reset-btn{background:none;border:1px solid #ccc;color:#999;padding:8px 24px;border-radius:6px;cursor:pointer;font-size:.8em;transition:all .2s}
.reset-btn:hover{border-color:#c4a265;color:#c4a265}
.footer-note{text-align:center;font-size:.7em;color:#bbb;padding:10px 0 30px}
@media(max-width:600px){header h1{font-size:1.1em}.step{padding:12px 14px}.section-header{padding:14px}}
</style>
</head>
<body>
<header>
<h1>Instagram毎週プロモーション運用マニュアル</h1>
<p class="sub">各店舗共通 詳細手順書</p>
</header>
<div class="progress-area">
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
<div class="progress-text" id="progressText">0 / 40 完了</div>
</div>
<div class="container" id="app"></div>
<script>
const DATA=[

{n:24,t:"今週の初稿データをまとめる",d:"採用素材・構成案・テロップ案・キャプション案・ハッシュタグ・BGM候補を一箇所に集約",c:"初稿一式が一箇所にまとまっている"},

{n:35,t:"投稿前に最後の誤字確認をする",d:"店舗名・料理名・漢字・CTA・ハッシュタグ表記を確認",c:"誤字脱字がない"},
{n:36,t:"投稿する",d:"完成動画・最終キャプション・ハッシュタグ・予約サイト導線を入れて公開",c:"投稿が公開されている"},
{n:37,t:"投稿後に見え方を確認する",d:"サムネ・改行崩れ・キャプションの読みにくさ・ハッシュタグ・全体の格を確認",c:"投稿後表示に大きな問題がない"}
]},
{id:"close",title:"週の締め作業",sub:"記録・振り返り",icon:"📝",steps:[
{n:38,t:"使用素材を記録する",d:"投稿日・店舗名・週の役割・メイン訴求・使用素材名・キャプション冒頭・ハッシュタグ・BGM",c:"後から見返せる記録が残っている"},
{n:39,t:"良かった点と改善点を1つずつ残す",d:"例：良かった点＝空間訴求が強く接待感が出た、改善点＝テロップが少し多かった",c:"次回に活かせるメモが残っている"},
{n:40,t:"次週に向けて素材不足を確認する",d:"個室写真・接客感写真・旬食材アップ・空間全景など不足素材を把握",c:"次回撮影や素材依頼の必要が把握できている"}
]}
];
const TOTAL=40;
const KEY="instagram-manual-progress";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function updateProgress(){
let done=Object.values(state).filter(Boolean).length;
document.getElementById("progressBar").style.width=(done/TOTAL*100)+"%";
document.getElementById("progressText").textContent=done+" / "+TOTAL+" 完了";
DATA.forEach(sec=>{
let cnt=sec.steps.filter(s=>state[s.n]).length;
let el=document.querySelector('[data-sec-progress="'+sec.id+'"]');
if(el)el.textContent=cnt+"/"+sec.steps.length+" 完了";
});
}
function render(){
const app=document.getElementById("app");
let html="";
DATA.forEach(sec=>{
html+='<div class="section"><div class="section-header" onclick="toggleSection(\''+sec.id+'\')">';
html+='<div class="left"><div class="icon">'+sec.icon+'</div><div class="title-area"><h2>'+sec.title+'</h2>';
html+='<div class="sec-progress" data-sec-progress="'+sec.id+'">0/'+sec.steps.length+' 完了</div></div></div>';
html+='<div class="arrow" id="arrow-'+sec.id+'">&#9660;</div></div>';
html+='<div class="section-body" id="body-'+sec.id+'">';
sec.steps.forEach(s=>{
let checked=state[s.n]?'checked':'';
let doneClass=state[s.n]?'done':'';
html+='<div class="step '+doneClass+'" id="step-'+s.n+'">';
html+='<div class="check-wrap"><input type="checkbox" '+checked+' onchange="toggle('+s.n+',this)"></div>';
html+='<div class="step-content">';
html+='<div class="step-num">STEP '+s.n+'</div>';
html+='<div class="step-title">'+s.t+'</div>';
html+='<div class="step-desc">'+s.d+'</div>';
html+='<div class="step-complete">完了条件：'+s.c+'</div>';
html+='</div></div>';
});
html+='</div></div>';
});
html+='<div class="reset-area"><button class="reset-btn" onclick="resetAll()">進捗をリセットする</button></div>';
html+='<div class="footer-note">Instagram毎週プロモーション運用マニュアル 完全統合版</div>';
app.innerHTML=html;
updateProgress();
}
function toggle(n,el){
state[n]=el.checked;
save();
let step=document.getElementById("step-"+n);
if(el.checked)step.classList.add("done");else step.classList.remove("done");
updateProgress();
}
function toggleSection(id){
let body=document.getElementById("body-"+id);
let arrow=document.getElementById("arrow-"+id);
body.classList.toggle("open");
arrow.classList.toggle("open");
}
function resetAll(){
if(confirm("すべての進捗をリセットしますか？")){state={};save();render();}
}
render();
// Open first incomplete section only
let opened=false;
DATA.forEach(sec=>{
if(!opened && sec.steps.some(s=>!state[s.n])){toggleSection(sec.id);opened=true;}
});
</script>
</body>
</html>
