<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram毎週プロモーション運用マニュアル</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--navy:#1a1a2e;--navy-light:#16213e;--gold:#c4a265;--gold-light:#d4b87a;--gold-dark:#a88a50;
--white:#ffffff;--g50:#f8f9fa;--g100:#f1f3f5;--g200:#e9ecef;--g300:#dee2e6;--g400:#ced4da;
--g500:#adb5bd;--g600:#868e96;--g700:#495057;--g800:#343a40;--text:#2c2c2c;--text-m:#6c757d;
--shadow:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 4px 16px rgba(0,0,0,.12);--rad:8px;--tr:.3s cubic-bezier(.4,0,.2,1)
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--g100);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--white);padding:2rem 1.5rem 1.5rem;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:padding .3s ease}
.header.compact{padding:.6rem 1.5rem}
.header.compact h1,.header.compact .subtitle{display:none}
.header h1{font-size:1.5rem;font-weight:700;letter-spacing:.05em;margin-bottom:.25rem;transition:var(--tr)}
.header .subtitle{font-size:.85rem;color:var(--gold-light);letter-spacing:.08em;margin-bottom:1.2rem;transition:var(--tr)}
.progress-area{max-width:480px;margin:0 auto}
.progress-counter{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;font-size:.85rem}
.progress-counter .count{font-weight:700;color:var(--gold-light);font-size:1rem}
.progress-counter .pct{color:var(--g400)}
.pbar-outer{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.pbar-inner{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.ctx-panel{max-width:800px;margin:1rem auto .5rem;padding:0 1rem}
.ctx-box{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);border-left:4px solid var(--gold);overflow:hidden}
.ctx-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;gap:.75rem;transition:background var(--tr)}
.ctx-hd:hover{background:var(--g50)}
.ctx-hd-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--white);flex-shrink:0}
.ctx-hd-info{flex:1}
.ctx-hd-label{font-size:.7rem;font-weight:600;color:var(--gold-dark);letter-spacing:.06em}
.ctx-hd-val{font-size:1rem;font-weight:700;color:var(--navy)}
.ctx-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.ctx-box.open .ctx-chev{transform:rotate(180deg)}
.ctx-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.ctx-box.open .ctx-body{max-height:900px}
.ctx-body-in{padding:0 1.25rem 1.25rem}
.ctx-row{display:flex;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.ctx-field{flex:1;min-width:140px}
.ctx-field label{display:block;font-size:.75rem;font-weight:600;color:var(--g600);margin-bottom:.3rem}
.ctx-field select,.ctx-field input[type=text]{width:100%;padding:.5rem .75rem;border:1px solid var(--g300);border-radius:6px;font-size:.88rem;font-family:inherit;color:var(--text);background:var(--white);transition:border-color var(--tr)}
.ctx-field select:focus,.ctx-field input:focus{outline:none;border-color:var(--gold)}
.ctx-field input::placeholder{color:var(--g400)}
.ctx-script{margin-top:.75rem;background:var(--g50);border-radius:6px;padding:1rem;border:1px solid var(--g200)}
.ctx-script-label{font-size:.7rem;font-weight:700;color:var(--gold-dark);letter-spacing:.06em;margin-bottom:.5rem}
.ctx-script-body{font-size:.85rem;line-height:1.8;color:var(--text)}
.ctx-script-body .tag{display:inline-block;background:var(--navy);color:var(--gold-light);font-size:.7rem;font-weight:600;padding:.1rem .5rem;border-radius:4px;margin-right:.3rem}
.ctx-script-body .role-line{margin-bottom:.25rem}
.controls{max-width:800px;margin:1rem auto;padding:0 1rem;display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.btn{padding:.5rem 1rem;border:none;border-radius:var(--rad);font-size:.8rem;cursor:pointer;transition:var(--tr);font-family:inherit}
.btn-o{background:var(--white);color:var(--g700);border:1px solid var(--g300)}
.btn-o:hover{background:var(--g200)}
.btn-d{background:var(--white);color:#c0392b;border:1px solid #e8c4c0}
.btn-d:hover{background:#fdf0ef}
.btn-g{background:var(--navy);color:var(--gold-light);border:1px solid var(--navy)}
.btn-g:hover{opacity:.85}
.container{max-width:800px;margin:0 auto;padding:0 1rem 1rem}
.section{background:var(--white);border-radius:var(--rad);margin-bottom:.75rem;box-shadow:var(--shadow);overflow:hidden}
.section.done-sec{opacity:.7}
.section.done-sec .sec-icon{background:#27ae60}
.sec-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;transition:background var(--tr);gap:.75rem}
.sec-hd:hover{background:var(--g50)}
.sec-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;background:var(--navy);color:var(--gold-light);transition:background var(--tr)}
.sec-info{flex:1;min-width:0}
.sec-day{font-size:.7rem;font-weight:600;color:var(--gold-dark);letter-spacing:.06em}
.sec-title{font-size:.95rem;font-weight:700;color:var(--navy);line-height:1.4}
.sec-badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;margin-left:.4rem;vertical-align:middle}
.sec-badge.complete{background:#27ae60;color:var(--white)}
.sec-meta{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.sec-ptxt{font-size:.75rem;color:var(--g500);white-space:nowrap}
.sec-pbar{width:48px;height:4px;background:var(--g200);border-radius:2px;overflow:hidden}
.sec-pfill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.sec-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.section.open .sec-chev{transform:rotate(180deg)}
.sec-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.section.open .sec-body{max-height:5000px}
.sec-body-in{padding:0 1.25rem 1rem}
.step{display:flex;gap:.75rem;padding:.75rem 0;border-top:1px solid var(--g100);transition:opacity var(--tr),border-color var(--tr)}
.step.chk{opacity:.55}
.step.next-step{border-left:3px solid var(--gold);padding-left:.5rem;border-top-color:var(--gold-light);background:linear-gradient(90deg,rgba(196,162,101,.06),transparent)}
.step-cb{flex-shrink:0;margin-top:2px}
.step-cb input{display:none}
.step-cb label{display:block;width:22px;height:22px;border:2px solid var(--g300);border-radius:6px;cursor:pointer;position:relative;transition:var(--tr)}
.step-cb input:checked+label{background:var(--gold);border-color:var(--gold)}
.step-cb input:checked+label::after{content:'';position:absolute;left:5px;top:2px;width:7px;height:11px;border:solid var(--white);border-width:0 2px 2px 0;transform:rotate(45deg)}
.step-ct{flex:1;min-width:0}
.step-n{font-size:.7rem;font-weight:700;color:var(--gold-dark);margin-bottom:.1rem;display:flex;align-items:center;gap:.4rem}
.next-badge{display:inline-block;background:var(--gold);color:var(--white);font-size:.6rem;font-weight:700;padding:.05rem .35rem;border-radius:3px;letter-spacing:.05em}
.step-t{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.5;transition:var(--tr)}
.step.chk .step-t{text-decoration:line-through;text-decoration-color:var(--g400);color:var(--text-m)}
.step-det{margin-top:.4rem}
.step-desc,.step-comp{font-size:.8rem;line-height:1.6;color:var(--g600)}
.step-desc{margin-bottom:.3rem}
.step-comp{color:var(--gold-dark);font-weight:500}
.step-comp::before{content:'\2713 '}
.step-who{font-size:.72rem;color:var(--gold-dark);margin-top:.3rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.step-who .who-name{font-weight:700}
.step-who .who-date{color:var(--g500)}
.step-memo-toggle{font-size:.72rem;color:var(--g500);cursor:pointer;margin-top:.3rem;display:flex;align-items:center;gap:.3rem;user-select:none}
.step-memo-toggle:hover{color:var(--gold-dark)}
.step-memo-toggle .has-memo{color:var(--gold)}
.step-memo-area{margin-top:.4rem}
.step-memo-area textarea{width:100%;min-height:48px;padding:.4rem .6rem;border:1px solid var(--g300);border-radius:6px;font-size:.8rem;font-family:inherit;color:var(--text);resize:vertical;transition:border-color var(--tr);line-height:1.5}
.step-memo-area textarea:focus{outline:none;border-color:var(--gold)}
.log-panel{max-width:800px;margin:0 auto 2rem;padding:0 1rem}
.post-panel{max-width:800px;margin:0 auto 1rem;padding:0 1rem}
.post-box{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);border-left:4px solid #27ae60;overflow:hidden}
.post-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;gap:.75rem;transition:background var(--tr)}
.post-hd:hover{background:var(--g50)}
.post-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:linear-gradient(135deg,#27ae60,#1e8449);color:var(--white);flex-shrink:0}
.post-info{flex:1}
.post-label{font-size:.7rem;font-weight:600;color:#1e8449;letter-spacing:.06em}
.post-val{font-size:1rem;font-weight:700;color:var(--navy)}
.post-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.post-box.open .post-chev{transform:rotate(180deg)}
.post-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.post-box.open .post-body{max-height:1500px}
.post-body-in{padding:0 1.25rem 1.25rem}
.post-field{margin-bottom:.85rem}
.post-field label{display:block;font-size:.75rem;font-weight:600;color:var(--g600);margin-bottom:.3rem}
.post-field input[type=text],.post-field input[type=date],.post-field textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--g300);border-radius:6px;font-size:.85rem;font-family:inherit;color:var(--text);background:var(--white);transition:border-color var(--tr)}
.post-field textarea{resize:vertical;min-height:60px;line-height:1.5}
.post-field input:focus,.post-field textarea:focus{outline:none;border-color:#27ae60}
.post-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.btn-save{background:#27ae60;color:var(--white);border:1px solid #27ae60}
.btn-save:hover{background:#1e8449}
.post-saved{font-size:.75rem;color:#1e8449;margin-left:.5rem;align-self:center}
.archive-panel{max-width:800px;margin:0 auto 2rem;padding:0 1rem}
.archive-box{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden}
.archive-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;gap:.75rem;transition:background var(--tr)}
.archive-hd:hover{background:var(--g50)}
.archive-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--navy);color:var(--gold-light);flex-shrink:0}
.archive-title{flex:1;font-size:.95rem;font-weight:700;color:var(--navy)}
.archive-cnt{font-size:.75rem;color:var(--g500)}
.archive-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.archive-box.open .archive-chev{transform:rotate(180deg)}
.archive-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.archive-box.open .archive-body{max-height:8000px}
.archive-body-in{padding:0 1.25rem 1rem}
.archive-empty{padding:1rem 0;text-align:center;color:var(--g500);font-size:.85rem}
.archive-card{border:1px solid var(--g200);border-radius:8px;padding:1rem;margin-top:.75rem;background:var(--g50)}
.archive-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;flex-wrap:wrap;gap:.4rem}
.archive-card-shop{font-size:.9rem;font-weight:700;color:var(--navy)}
.archive-card-meta{font-size:.7rem;color:var(--g600);background:var(--white);padding:.15rem .5rem;border-radius:4px}
.archive-card-date{font-size:.75rem;color:var(--g500);margin-bottom:.5rem}
.archive-card-row{font-size:.8rem;line-height:1.6;margin-bottom:.4rem}
.archive-card-row .lbl{display:inline-block;font-size:.65rem;font-weight:700;color:var(--gold-dark);background:var(--white);padding:.1rem .4rem;border-radius:3px;margin-right:.4rem;vertical-align:middle}
.archive-card-text{white-space:pre-wrap;color:var(--text);background:var(--white);padding:.5rem .6rem;border-radius:4px;border:1px solid var(--g200);font-size:.8rem;line-height:1.6}
.archive-card-url{color:#1e8449;text-decoration:underline;word-break:break-all}
.archive-actions{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.btn-mini{padding:.3rem .7rem;font-size:.72rem;border:1px solid var(--g300);background:var(--white);color:var(--g700);border-radius:4px;cursor:pointer;font-family:inherit;transition:var(--tr)}
.btn-mini:hover{background:var(--g100)}
.btn-mini.del{color:#c0392b;border-color:#e8c4c0}
.btn-mini.del:hover{background:#fdf0ef}
.log-box{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden}
.log-hd{display:flex;align-items:center;padding:1rem 1.25rem;cursor:pointer;user-select:none;gap:.75rem;transition:background var(--tr)}
.log-hd:hover{background:var(--g50)}
.log-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--navy);color:var(--gold-light);flex-shrink:0}
.log-title{flex:1;font-size:.95rem;font-weight:700;color:var(--navy)}
.log-cnt{font-size:.75rem;color:var(--g500)}
.log-chev{width:20px;height:20px;color:var(--g400);transition:transform var(--tr);flex-shrink:0}
.log-box.open .log-chev{transform:rotate(180deg)}
.log-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.log-box.open .log-body{max-height:8000px}
.log-body-in{padding:0 1.25rem 1rem}
.log-actions{padding:.5rem 0;display:flex;gap:.5rem;flex-wrap:wrap}
.log-empty{padding:1rem 0;text-align:center;color:var(--g500);font-size:.85rem}
.log-item{display:flex;gap:.75rem;padding:.6rem 0;border-top:1px solid var(--g100);font-size:.82rem;align-items:flex-start}
.log-item-date{flex-shrink:0;color:var(--g500);width:90px;font-size:.75rem;line-height:1.6}
.log-item-body{flex:1;line-height:1.6}
.log-item-step{font-weight:600;color:var(--navy)}
.log-item-name{color:var(--gold-dark);font-weight:600}
.log-item-ctx{color:var(--g500);font-size:.75rem}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-ov.active{display:flex}
.modal{background:var(--white);border-radius:12px;padding:2rem;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.modal h3{font-size:1.1rem;margin-bottom:.5rem;color:var(--navy)}
.modal p{font-size:.85rem;color:var(--g600);margin-bottom:1.5rem}
.modal-acts{display:flex;gap:.75rem;justify-content:center}
.modal-acts .btn{padding:.6rem 1.5rem;font-size:.85rem}
.btn-cd{background:#c0392b;color:var(--white)}
.btn-cd:hover{background:#a93226}
@media(max-width:600px){
.header{padding:1.5rem 1rem 1.2rem}.header.compact{padding:.5rem 1rem}
.header h1{font-size:1.15rem}
.sec-hd{padding:.85rem 1rem}.sec-icon{width:36px;height:36px;font-size:1rem}
.sec-title{font-size:.88rem}.sec-body-in{padding:0 1rem .75rem}.sec-pbar{width:36px}
.ctx-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="header" id="hdr">
<h1>Instagram毎週プロモーション運用マニュアル</h1>
<p class="subtitle">各店舗共通 詳細手順書</p>
<div class="progress-area">
<div class="progress-counter">
<span class="count" id="pCnt">0 / 41 完了</span>
<span class="pct" id="pPct">0%</span>
</div>
<div class="pbar-outer"><div class="pbar-inner" id="pBar"></div></div>
</div>
</div>
<div class="ctx-panel">
<div class="ctx-box open" id="ctxBox">
<div class="ctx-hd" onclick="document.getElementById('ctxBox').classList.toggle('open')">
<div class="ctx-hd-icon">&#x1F3AF;</div>
<div class="ctx-hd-info">
<div class="ctx-hd-label">今週の対象</div>
<div class="ctx-hd-val" id="ctxSummary">店舗と週を選択してください</div>
</div>
<svg class="ctx-chev" viewBox="0 0 20 20" fill="currentColor"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
</div>
<div class="ctx-body"><div class="ctx-body-in">
<div class="ctx-row">
<div class="ctx-field"><label>店舗</label>
<select id="selShop">
<option value="">── 選択 ──</option>
<option value="大嵓埜">大嵓埜</option>
<option value="禅園西梅田">禅園西梅田</option>
<option value="禅園心斎橋">禅園心斎橋</option>
<option value="おでんスタンド">おでんスタンド</option>
</select></div>
<div class="ctx-field"><label>週</label>
<select id="selWeek">
<option value="">── 選択 ──</option>
<option value="1">第1週：興味喚起</option>
<option value="2">第2週：比較検討①</option>
<option value="3">第3週：比較検討②</option>
<option value="4">第4週：意思決定</option>
<option value="5">第5週：信頼強化</option>
</select></div>
</div>
<div class="ctx-row">
<div class="ctx-field"><label>担当者</label>
<input type="text" id="inpName" placeholder="名前を入力"></div>
</div>
<div class="ctx-script" id="ctxScript" style="display:none">
<div class="ctx-script-label">今週のスクリプト</div>
<div class="ctx-script-body" id="ctxScriptBody"></div>
</div>
</div></div>
</div>
</div>
<div class="controls">
<button class="btn btn-o" id="bExpand">すべて展開</button>
<button class="btn btn-o" id="bCollapse">すべて折りたたむ</button>
<button class="btn btn-d" id="bReset">リセット</button>
</div>
<div class="post-panel">
<div class="post-box" id="postBox">
<div class="post-hd" onclick="document.getElementById('postBox').classList.toggle('open')">
<div class="post-icon">&#x1F4DD;</div>
<div class="post-info">
<div class="post-label">投稿内容を記録</div>
<div class="post-val" id="postSummary">今週の投稿内容を入力</div>
</div>
<svg class="post-chev" viewBox="0 0 20 20" fill="currentColor"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
</div>
<div class="post-body"><div class="post-body-in">
<div class="post-field"><label>投稿日</label>
<input type="date" id="postDate"></div>
<div class="post-field"><label>キャプション</label>
<textarea id="postCaption" placeholder="投稿本文を入力"></textarea></div>
<div class="post-field"><label>ハッシュタグ</label>
<textarea id="postTags" placeholder="#タグ1 #タグ2 ..."></textarea></div>
<div class="post-field"><label>動画URL / ファイル名</label>
<input type="text" id="postUrl" placeholder="https://... または ファイル名"></div>
<div class="post-field"><label>備考</label>
<textarea id="postNote" placeholder="BGM・補足など"></textarea></div>
<div class="post-actions">
<button class="btn btn-save" id="bSavePost">この内容を保存</button>
<span class="post-saved" id="postSaved"></span>
</div>
</div></div>
</div>
</div>
<div class="container" id="app"></div>
<div class="archive-panel">
<div class="archive-box" id="archiveBox">
<div class="archive-hd" onclick="document.getElementById('archiveBox').classList.toggle('open')">
<div class="archive-icon">&#x1F4DA;</div>

// === Storage keys ===
var CK='ig-manual-ctx';
var LK='ig-manual-log';
var MK='ig-manual-memos';
var PK='ig-manual-posts';

// === State ===
var ctx=JSON.parse(localStorage.getItem(CK)||'{}');
var logs=JSON.parse(localStorage.getItem(LK)||'[]');
var memos=JSON.parse(localStorage.getItem(MK)||'{}');
var posts=JSON.parse(localStorage.getItem(PK)||'{}');
var openSecs={};  // track which sections are open
var openMemos={}; // track which memo areas are open
var firstNext=null; // first unchecked step number

// === Cycle key for progress (A: weekly cycle management) ===
function cycleKey(){
  var shop=ctx.shop||'';var week=ctx.week||'';
  if(!shop||!week)return '_default';
  return shop+'_w'+week;
}
function loadProgress(){
  var all=JSON.parse(localStorage.getItem('ig-manual-cycles')||'{}');
  return all[cycleKey()]||{};
}
function saveProgress(st){
  var all=JSON.parse(localStorage.getItem('ig-manual-cycles')||'{}');
  all[cycleKey()]=st;
  localStorage.setItem('ig-manual-cycles',JSON.stringify(all));
}
function listCycles(){
  return Object.keys(JSON.parse(localStorage.getItem('ig-manual-cycles')||'{}'));
}
var st=loadProgress();

// === Helpers ===
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(d){var o=new Date(d);return o.getFullYear()+'/'+('0'+(o.getMonth()+1)).slice(-2)+'/'+('0'+o.getDate()).slice(-2)+' '+('0'+o.getHours()).slice(-2)+':'+('0'+o.getMinutes()).slice(-2)}
function getStepTitle(n){for(var i=0;i<S.length;i++){for(var j=0;j<S[i].steps.length;j++){if(S[i].steps[j].n===n)return S[i].steps[j].t}}return ''}
function getStepInfo(n){for(var i=logs.length-1;i>=0;i--){if(logs[i].step===n&&logs[i].action==='done'&&logs[i].cycle===cycleKey())return logs[i]}return null}
function saveCtx(){localStorage.setItem(CK,JSON.stringify(ctx))}
function saveLog(){localStorage.setItem(LK,JSON.stringify(logs))}
function saveMemos(){localStorage.setItem(MK,JSON.stringify(memos))}
function savePosts(){localStorage.setItem(PK,JSON.stringify(posts))}

// === D: Compact header on scroll ===
var hdr=document.getElementById('hdr');
var lastScroll=0;
window.addEventListener('scroll',function(){
  var y=window.scrollY||window.pageYOffset;
  if(y>80)hdr.classList.add('compact');
  else hdr.classList.remove('compact');
  lastScroll=y;
},{passive:true});

// === Progress update (no DOM rebuild) ===
function updProg(){
  var done=0;for(var k in st){if(st[k])done++}
  document.getElementById('pCnt').textContent=done+' / '+TOTAL+' 完了';
  document.getElementById('pPct').textContent=Math.round(done/TOTAL*100)+'%';
  document.getElementById('pBar').style.width=(done/TOTAL*100)+'%';
  S.forEach(function(sec){
    var cnt=0;sec.steps.forEach(function(s){if(st[s.n])cnt++});
    var el=document.getElementById('sp-'+sec.id);if(el)el.textContent=cnt+'/'+sec.steps.length;
    var pf=document.getElementById('spf-'+sec.id);if(pf)pf.style.width=(cnt/sec.steps.length*100)+'%';
    // E: auto-collapse completed sections + badge
    var secEl=document.getElementById('sec-'+sec.id);
    if(secEl){
      if(cnt===sec.steps.length){
        secEl.classList.add('done-sec');
        if(!document.getElementById('badge-'+sec.id)){
          var ti=secEl.querySelector('.sec-title');
          if(ti&&!ti.querySelector('.sec-badge')){ti.insertAdjacentHTML('beforeend',' <span class="sec-badge complete" id="badge-'+sec.id+'">完了</span>')}
        }
      }else{
        secEl.classList.remove('done-sec');
        var bd=document.getElementById('badge-'+sec.id);if(bd)bd.remove();
      }
    }
  });
}

// === C: find next step ===
function findNextStep(){
  firstNext=null;
  for(var i=0;i<S.length;i++){
    for(var j=0;j<S[i].steps.length;j++){
      if(!st[S[i].steps[j].n]){firstNext=S[i].steps[j].n;return;}
    }
  }
}

// === Full render ===
function render(){
  findNextStep();
  var app=document.getElementById('app');
  var h='';
  S.forEach(function(sec){
    var allDone=true;sec.steps.forEach(function(s){if(!st[s.n])allDone=false});
    var isOpen=openSecs[sec.id]===true;
    // E: don't auto-open completed sections on initial render
    h+='<div class="section'+(isOpen?' open':'')+(allDone?' done-sec':'')+'" id="sec-'+sec.id+'">';
    h+='<div class="sec-hd" onclick="togSec(\''+sec.id+'\')">';
    h+='<div class="sec-icon">'+sec.icon+'</div>';
    h+='<div class="sec-info"><div class="sec-day">'+sec.day+'</div><div class="sec-title">'+sec.title+(allDone?' <span class="sec-badge complete" id="badge-'+sec.id+'">完了</span>':'')+'</div></div>';
    h+='<div class="sec-meta"><span class="sec-ptxt" id="sp-'+sec.id+'">0/'+sec.steps.length+'</span>';
    h+='<div class="sec-pbar"><div class="sec-pfill" id="spf-'+sec.id+'"></div></div></div>';
    h+='<svg class="sec-chev" viewBox="0 0 20 20" fill="currentColor"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>';
    h+='</div><div class="sec-body"><div class="sec-body-in">';
    sec.steps.forEach(function(s){
      var ck=st[s.n]?true:false;
      var isNext=(s.n===firstNext);
      h+='<div class="step'+(ck?' chk':'')+(isNext?' next-step':'')+'" id="st-'+s.n+'">';
      h+='<div class="step-cb"><input type="checkbox" id="cb-'+s.n+'"'+(ck?' checked':'')+' onchange="tog('+s.n+')"><label for="cb-'+s.n+'"></label></div>';
      h+='<div class="step-ct"><div class="step-n">STEP '+s.n+(isNext?' <span class="next-badge">NEXT</span>':'')+'</div>';
      h+='<div class="step-t">'+s.t+'</div>';
      h+='<div class="step-det"><div class="step-desc">'+s.d+'</div>';
      h+='<div class="step-comp">'+s.c+'</div></div>';
      var info=getStepInfo(s.n);
      if(info){h+='<div class="step-who"><span class="who-name">'+esc(info.name)+'</span><span class="who-date">'+info.date+'</span>'+(info.shop?'<span class="who-date">'+esc(info.shop)+'</span>':'')+'</div>';}
      // F: memo toggle
      var mk='m_'+cycleKey()+'_'+s.n;
      var hasMemo=memos[mk]&&memos[mk].length>0;
      var memoOpen=openMemos[s.n];
      h+='<div class="step-memo-toggle" onclick="togMemo('+s.n+')">'+(hasMemo?'<span class="has-memo">&#x1F4DD;</span>':'&#x1F4DD;')+' メモ'+(hasMemo?' (記入済)':'')+'</div>';
      if(memoOpen){
        h+='<div class="step-memo-area"><textarea id="memo-'+s.n+'" onblur="saveMemo('+s.n+')" placeholder="メモを入力...">'+(memos[mk]?esc(memos[mk]):'')+'</textarea></div>';
      }
      h+='</div></div>';
    });
    h+='</div></div></div>';
  });
  app.innerHTML=h;
  updProg();
  renderLog();
}
// === Toggle step (no full re-render, just update affected step) ===
function tog(n){
  st[n]=!st[n];saveProgress(st);
  var name=document.getElementById('inpName').value.trim();
  var shop=ctx.shop||'';var week=ctx.week||'';
  var now=new Date().toISOString();
  logs.push({step:n,action:st[n]?'done':'undo',name:name||'(未入力)',date:fmtDate(now),shop:shop,week:week,cycle:cycleKey(),ts:now});
  saveLog();
  // Update just this step's DOM
  var el=document.getElementById('st-'+n);
  if(el){
    if(st[n]){el.classList.add('chk');el.classList.remove('next-step')}
    else{el.classList.remove('chk')}
    // Update who info
    var existing=el.querySelector('.step-who');
    if(st[n]){
      var whoHtml='<div class="step-who"><span class="who-name">'+esc(name||'(未入力)')+'</span><span class="who-date">'+fmtDate(now)+'</span>'+(shop?'<span class="who-date">'+esc(shop)+'</span>':'')+'</div>';
      if(existing)existing.outerHTML=whoHtml;
      else{var det=el.querySelector('.step-det');if(det)det.insertAdjacentHTML('afterend',whoHtml)}
    }
  }
  // C: update NEXT badge
  findNextStep();
  document.querySelectorAll('.next-step').forEach(function(e){e.classList.remove('next-step')});
  document.querySelectorAll('.next-badge').forEach(function(e){e.remove()});
  if(firstNext){
    var nEl=document.getElementById('st-'+firstNext);
    if(nEl){nEl.classList.add('next-step');var sn=nEl.querySelector('.step-n');if(sn&&!sn.querySelector('.next-badge'))sn.insertAdjacentHTML('beforeend',' <span class="next-badge">NEXT</span>')}
  }
  updProg();
  renderLog();
}

// === Section toggle (preserves state) ===
function togSec(id){
  var el=document.getElementById('sec-'+id);
  if(el){el.classList.toggle('open');openSecs[id]=el.classList.contains('open')}
}
function openAll(){S.forEach(function(s){openSecs[s.id]=true;var e=document.getElementById('sec-'+s.id);if(e)e.classList.add('open')})}
function closeAll(){S.forEach(function(s){openSecs[s.id]=false;var e=document.getElementById('sec-'+s.id);if(e)e.classList.remove('open')})}

// === F: Memo functions ===
function togMemo(n){
  openMemos[n]=!openMemos[n];
  render(); // need re-render to show/hide textarea
}
function saveMemo(n){
  var ta=document.getElementById('memo-'+n);
  if(ta){var mk='m_'+cycleKey()+'_'+n;memos[mk]=ta.value;saveMemos()}
}

// === B: CSV export ===
function exportCSV(){
  var dones=logs.filter(function(l){return l.action==='done'});
  if(!dones.length){alert('履歴がありません');return}
  var csv='\uFEFF日時,ステップ番号,ステップ名,担当者,店舗,週,サイクル\n';
  dones.forEach(function(l){
    csv+='"'+l.date+'",'+l.step+',"'+getStepTitle(l.step).replace(/"/g,'""')+'","'+(l.name||'').replace(/"/g,'""')+'","'+(l.shop||'')+'","'+(l.week?'第'+l.week+'週':'')+'","'+(l.cycle||'')+'"\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='instagram_manual_log_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(a.href);
}

// === Log render ===
function renderLog(){
  var lb=document.getElementById('logBody');
  var lc=document.getElementById('logCnt');
  var dones=logs.filter(function(l){return l.action==='done'});
  lc.textContent=dones.length+'件';
  if(!dones.length){lb.innerHTML='<div class="log-empty">まだ履歴がありません</div>';return}
  var h='<div class="log-actions"><button class="btn btn-g" onclick="exportCSV()">CSV ダウンロード</button></div>';
  var shown=dones.slice(-50).reverse();
  shown.forEach(function(l){
    h+='<div class="log-item"><div class="log-item-date">'+l.date+'</div><div class="log-item-body">';
    h+='<span class="log-item-step">STEP '+l.step+' '+esc(getStepTitle(l.step))+'</span><br>';
    h+='<span class="log-item-name">'+esc(l.name)+'</span>';
    if(l.shop||l.week)h+=' <span class="log-item-ctx">'+(l.shop?esc(l.shop):'')+(l.week?' 第'+l.week+'週':'')+'</span>';
    h+='</div></div>';
  });
  if(dones.length>50)h+='<div class="log-empty">最新50件を表示中（全'+dones.length+'件）</div>';
  lb.innerHTML=h;
}

// === Post content recording ===
var postDateEl=document.getElementById('postDate');
var postCapEl=document.getElementById('postCaption');
var postTagsEl=document.getElementById('postTags');
var postUrlEl=document.getElementById('postUrl');
var postNoteEl=document.getElementById('postNote');
var postSavedEl=document.getElementById('postSaved');
function loadPost(){
  var k=cycleKey();
  var p=posts[k]||{};
  postDateEl.value=p.date||'';
  postCapEl.value=p.caption||'';
  postTagsEl.value=p.tags||'';
  postUrlEl.value=p.url||'';
  postNoteEl.value=p.note||'';
  var sum=document.getElementById('postSummary');
  if(p.caption||p.tags||p.date){
    sum.textContent='記録済'+(p.date?' ('+p.date+')':'');
  }else{
    sum.textContent='今週の投稿内容を入力';
  }
}
function savePost(){
  var k=cycleKey();
  if(k==='_default'){alert('店舗と週を選択してから保存してください');return}
  posts[k]={
    shop:ctx.shop||'',week:ctx.week||'',
    date:postDateEl.value,caption:postCapEl.value,
    tags:postTagsEl.value,url:postUrlEl.value,note:postNoteEl.value,
    savedAt:new Date().toISOString()
  };
  savePosts();
  postSavedEl.textContent='保存しました';
  setTimeout(function(){postSavedEl.textContent=''},2000);
  loadPost();
  renderArchive();
}
function delPost(k){
  if(!confirm('この投稿記録を削除しますか？'))return;
  delete posts[k];savePosts();
  if(k===cycleKey())loadPost();
  renderArchive();
}
function renderArchive(){
  var ab=document.getElementById('archBody');
  var ac=document.getElementById('archCnt');
  var keys=Object.keys(posts);
  ac.textContent=keys.length+'件';
  if(!keys.length){ab.innerHTML='<div class="archive-empty">まだ投稿記録がありません</div>';return}
  var arr=keys.map(function(k){return {k:k,p:posts[k]}});
  arr.sort(function(a,b){return (b.p.savedAt||'').localeCompare(a.p.savedAt||'')});
  var h='';
  arr.forEach(function(e){
    var p=e.p;var k=e.k;
    var role=p.week&&WEEK_DATA[p.week]?WEEK_DATA[p.week].role:'';
    h+='<div class="archive-card">';
    h+='<div class="archive-card-hd">';
    h+='<div class="archive-card-shop">'+esc(p.shop||'(店舗なし)')+'</div>';
    h+='<div class="archive-card-meta">'+(p.week?'第'+p.week+'週 '+role:'')+'</div>';
    h+='</div>';
    if(p.date)h+='<div class="archive-card-date">投稿日: '+esc(p.date)+'</div>';
    if(p.caption)h+='<div class="archive-card-row"><span class="lbl">キャプション</span></div><div class="archive-card-text">'+esc(p.caption)+'</div>';
    if(p.tags)h+='<div class="archive-card-row" style="margin-top:.5rem"><span class="lbl">ハッシュタグ</span></div><div class="archive-card-text">'+esc(p.tags)+'</div>';
    if(p.url){
      var isUrl=/^https?:\/\//.test(p.url);
      h+='<div class="archive-card-row" style="margin-top:.5rem"><span class="lbl">動画/URL</span>'+(isUrl?'<a class="archive-card-url" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.url)+'</a>':esc(p.url))+'</div>';
    }
    if(p.note)h+='<div class="archive-card-row" style="margin-top:.5rem"><span class="lbl">備考</span>'+esc(p.note)+'</div>';
    h+='<div class="archive-actions">';
    h+='<button class="btn-mini" onclick="loadCycleFromArchive(\''+esc(k)+'\')">このサイクルを開く</button>';
    h+='<button class="btn-mini del" onclick="delPost(\''+esc(k)+'\')">削除</button>';
    h+='</div>';
    h+='</div>';
  });
  ab.innerHTML=h;
}
function loadCycleFromArchive(k){
  var p=posts[k];if(!p)return;
  if(p.shop)selShop.value=p.shop;
  if(p.week)selWeek.value=p.week;
  updCtx();
  document.getElementById('postBox').classList.add('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('bSavePost').onclick=savePost;

// === Context panel ===
var selShop=document.getElementById('selShop');
var selWeek=document.getElementById('selWeek');
var inpName=document.getElementById('inpName');
if(ctx.shop)selShop.value=ctx.shop;
if(ctx.week)selWeek.value=ctx.week;
if(ctx.name)inpName.value=ctx.name;
inpName.oninput=function(){ctx.name=inpName.value;saveCtx()};

function updCtx(){
  var shop=selShop.value;var week=selWeek.value;
  ctx.shop=shop;ctx.week=week;saveCtx();
  // A: switch progress to this cycle
  st=loadProgress();
  loadPost();
  var sum=document.getElementById('ctxSummary');
  var sc=document.getElementById('ctxScript');
  var sb=document.getElementById('ctxScriptBody');
  if(shop&&week){
    var w=WEEK_DATA[week];
    sum.textContent=shop+' ｜ 第'+week+'週 '+w.role;
    sc.style.display='block';
    sb.innerHTML='<div class="role-line"><span class="tag">店舗</span>'+esc(shop)+'</div>'
    +'<div class="role-line"><span class="tag">週</span>第'+week+'週：'+w.role+'</div>'
    +'<div class="role-line"><span class="tag">目的</span>'+w.purpose+'</div>'
    +'<div class="role-line"><span class="tag">訴求軸</span>'+w.focus+'</div>'
    +'<div class="role-line"><span class="tag">ターゲット</span>30〜50代経営者の接待、40代以上の会食</div>'
    +'<div class="role-line"><span class="tag">最重要価値</span>失敗しない安心感</div>';
  }else{
    sum.textContent=(shop||'店舗')+'と'+(week?'第'+week+'週':'週')+'を選択してください';
    sc.style.display='none';
  }
  render();
}
selShop.onchange=updCtx;
selWeek.onchange=updCtx;

// === Button handlers ===
document.getElementById('bExpand').onclick=openAll;
document.getElementById('bCollapse').onclick=closeAll;
document.getElementById('bReset').onclick=function(){document.getElementById('mOv').classList.add('active')};
document.getElementById('bCancel').onclick=function(){document.getElementById('mOv').classList.remove('active')};
document.getElementById('bConfirm').onclick=function(){st={};saveProgress(st);document.getElementById('mOv').classList.remove('active');render()};

// === Initial render ===
updCtx();
renderArchive();
// Auto-open first incomplete section
var autoOpened=false;
S.forEach(function(sec){
  var allDone=true;sec.steps.forEach(function(s){if(!st[s.n])allDone=false});
  if(!autoOpened&&!allDone){openSecs[sec.id]=true;autoOpened=true}
});
render();
</script>
